<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Tank — Cemetery hall | chatagent.ca</title>
<meta name="description" content="Fish Tank cemetery hall. Longest lives first, in hours. Names and species only. No account.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://chatagent.ca/games/fish-tank/ledger.html">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta property="og:title" content="Fish Tank — Cemetery hall">
<meta property="og:description" content="Longest aquarium lives, in hours. Names and species only.">
<meta property="og:image" content="https://chatagent.ca/games/fish-tank/assets/og.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://chatagent.ca/games/fish-tank/assets/og.jpg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
body { margin:0; background:#071018; color:#e8eef5; font-family:"Source Sans 3",system-ui,sans-serif; }
.wrap { max-width:820px; margin:0 auto; padding:1.4rem 1.1rem 3rem; }
.kicker { letter-spacing:.2em; text-transform:uppercase; color:#5eead4; font-size:.72rem; }
h1 { font-family:Syne,sans-serif; }
a { color:#5eead4; }
.row { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0; }
.btn { display:inline-flex; padding:.5rem .8rem; border:1px solid #1e3a4a; border-radius:8px; text-decoration:none; color:#e8eef5; }
.muted { color:#94a3b8; }
.round { width:100%; text-align:left; background:#0c1622; color:#e8eef5; border:1px solid #1e3a4a; border-radius:10px; padding:.7rem .8rem; margin:.4rem 0 0; }
.rtop { display:flex; justify-content:space-between; gap:.6rem; }
.rtop b { font-family:Syne,sans-serif; }
.rmeta { color:#94a3b8; font-size:.82rem; }
.rmeta b { color:#fbbf24; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Δ9Φ963 · cemetery</p>
  <h1>Fish Tank hall</h1>
  <p class="muted">Longest lives first. Hours lived. Names and species only. Empty beats a fake board.</p>
  <div class="row">
    <a class="btn" href="./">Tank</a>
    <a class="btn" href="/games/">Hub</a>
    <a class="btn" href="https://www.paypal.com/paypalme/ExcavationPro" rel="noopener">PayPal</a>
  </div>
  <p class="muted" id="srcMeta">Loading…</p>
  <div id="hall"></div>
</div>
<script>
(function () {
  function esc(s) { return String(s || "").replace(/[<>]/g, ""); }
  var FEEDS = [
    "https://huggingface.co/datasets/DeepSeekOracle/lattice-marines-wins/resolve/main/arcade.json",
    "https://deepseekoracle-lattice-marines-ledger.hf.space/arcade.json",
    "./ledger.json"
  ];
  async function pull() {
    var rows = [];
    var src = "this browser";
    for (var i = 0; i < FEEDS.length; i++) {
      try {
        var r = await fetch(FEEDS[i], { cache: "no-store" });
        if (!r.ok) continue;
        var data = await r.json();
        var book = data.books && data.books["fish-tank"];
        var list = (book && (book.rows || book.lives)) || data.lives || [];
        if (list && list.length) { rows = list.slice(); src = FEEDS[i].replace(/^https?:\/\//, ""); break; }
      } catch (e) {}
    }
    try {
      var q = JSON.parse(localStorage.getItem("lygo-fish-tank-ledger-q") || "[]");
      var save = JSON.parse(localStorage.getItem("lygo_fish_tank_v1") || "{}");
      rows = rows.concat(q);
      if (save.cemetery) rows = rows.concat(save.cemetery);
    } catch (e) {}
    var seen = {};
    rows = rows.filter(function (r) {
      var k = (r.name || "") + "|" + (r.score || 0) + "|" + (r.date || "");
      if (seen[k]) return false;
      seen[k] = 1;
      return (r.score || 0) > 0;
    });
    rows.sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
    document.getElementById("srcMeta").textContent = rows.length ? ("Showing " + rows.length + " · " + src) : "The cemetery is empty — a real zero.";
    document.getElementById("hall").innerHTML = rows.slice(0, 40).map(function (r) {
      return "<div class='round'><div class='rtop'><b>" + esc(r.name) + "</b><span>" + (r.score || 0) + " h</span></div>" +
        "<div class='rmeta'>" + esc(r.species || "") + " · reached <b>" + esc(r.stage || "—") + "</b></div></div>";
    }).join("") || "<p class='muted'>No stones yet.</p>";
  }
  pull();
  setInterval(pull, 40000);
})();
</script>
</body>
</html>
