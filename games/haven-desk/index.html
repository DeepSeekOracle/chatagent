<body>
<div id="boot">
  <p>Haven Hearth BIOS 1.0</p>
  <p id="boot-line">Checking field memory&nbsp;&nbsp;640K OK</p>
  <p>Haven Desk 98</p>
  <p class="hint">Click to sit down.</p>
  <p><a class="games-mini" href="/games/">All games</a></p>
</div>

<div id="desk" hidden>
  <div id="stage">
    <div id="desktop"></div>
    <div id="windows"></div>
  </div>
  <nav id="taskbar" aria-label="Desk bar">
    <button id="desk-btn" class="raised" type="button" aria-haspopup="true" aria-expanded="false">
      <svg viewBox="0 0 18 18" aria-hidden="true">
        <rect x="1" y="1" width="16" height="16" fill="#c0c0c0" stroke="#000"/>
        <rect x="3" y="3" width="12" height="4" fill="#000080"/>
        <rect x="7" y="9" width="4" height="5" fill="#c45a12"/>
      </svg>
      <span>Desk</span>
    </button>
    <div id="tasks"></div>
    <a class="games-mini" href="/games/">All games</a>
    <div id="clock" class="sunken"></div>
  </nav>
  <div id="desk-menu" class="raised" hidden role="menu"></div>
</div>

<div id="off" hidden>
  <h1>It is now safe to leave the desk.</h1>
  <p><button id="on-again" class="raised" type="button">Turn the desk back on</button></p>
  <p><a class="games-mini" href="/games/">All games</a></p>
</div>
