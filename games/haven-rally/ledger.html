<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haven Rally — Local ledger | chatagent.ca</title>
<meta name="description" content="This browser’s Haven Rally hall. Heats stay local. Empty beats a fake global board.">
<link rel="canonical" href="https://chatagent.ca/games/haven-rally/ledger.html">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Syne:wght@700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/games/hub.css">
<style>
body { margin:0; background:#070b12; color:#e8eef5; font-family:"Source Sans 3",system-ui,sans-serif; }
.wrap { max-width:820px; margin:0 auto; padding:1.4rem 1.1rem 3rem; }
.kicker { letter-spacing:.2em; text-transform:uppercase; color:#5eead4; font-size:.72rem; }
h1 { font-family:Syne,sans-serif; }
a { color:#5eead4; }
.row { display:flex; gap:.5rem; flex-wrap:wrap; margin:1rem 0; }
.btn { display:inline-flex; padding:.5rem .8rem; border:1px solid #1e3a4a; border-radius:8px; text-decoration:none; color:#e8eef5; }
.muted { color:#94a3b8; }
.round {
  width:100%; text-align:left; background:#0c1622; color:#e8eef5; border:1px solid #1e3a4a;
  border-radius:10px; padding:.7rem .8rem; margin:.4rem 0 0; font:inherit;
}
.rtop { display:flex; justify-content:space-between; gap:.6rem; flex-wrap:wrap; }
.rtop b { font-family:Syne,sans-serif; color:#fbbf24; }
</style>
</head>
<body>
<div class="wrap">
  <p class="kicker">Δ9Φ963 · local only</p>
  <h1>Haven Rally ledger</h1>
  <p class="muted">This hall is this browser. No network write.</p>
  <div class="row">
    <a class="btn" href="./">Play</a>
    <a class="btn" href="./whitepaper.html">Whitepaper</a>
    <a class="btn" href="/games/">All games</a>
    <a class="btn" href="https://www.paypal.com/paypalme/ExcavationPro" rel="noopener">PayPal</a>
  </div>
  <div id="hall"></div>
</div>
<script>
(function(){
  function fmt(ms){
    if (ms==null || !isFinite(ms)) return "—";
    var s=ms/1000, m=Math.floor(s/60), r=s-m*60;
    return m+":"+r.toFixed(3).padStart(6,"0");
  }
  function esc(s){ return String(s||"").replace(/[<>]/g,""); }
  try {
    var s = JSON.parse(localStorage.getItem("lygo-haven-rally-v1") || "{}");
    var rows = s.rounds || [];
    var hall = document.getElementById("hall");
    if (!rows.length) {
      hall.innerHTML = "<p class='muted'>No heats on this device yet.</p>";
      return;
    }
    hall.innerHTML = rows.map(function(r){
      return "<div class='round'><div class='rtop'><b>"+esc(r.track)+"</b><span>"+fmt(r.ms)+"</span></div>"+
        "<p class='muted'>"+esc(r.name)+" · "+esc(r.craft)+(r.beat?" · ghost rewritten":"")+"</p></div>";
    }).join("");
  } catch(e) {
    document.getElementById("hall").textContent = "Ledger unreadable.";
  }
})();
</script>
</body>
</html>
