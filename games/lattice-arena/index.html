<body>
<div id="boot" class="boot">
  <p class="kicker">Δ9Φ963 · chatagent.ca</p>
  <h1>LYGO Arena</h1>
  <p class="boot-msg">Waking the kits…</p>
</div>

<header class="top">
  <a class="brand" href="/">chatagent.ca</a>
  <a class="games-mini" href="/games/">All games</a>
  <div class="phase-pill" id="matchPill">3v3</div>
  <span class="grow"></span>
  <div class="speed" role="group" aria-label="Battle speed">
    <button type="button" class="btn ghost" data-speed="1">1×</button>
    <button type="button" class="btn ghost" data-speed="2">2×</button>
    <button type="button" class="btn ghost" data-speed="4">4×</button>
    <button type="button" class="btn ghost" data-speed="8">8×</button>
  </div>
  <button type="button" class="btn ghost" data-act="pause" id="btnPause">Pause</button>
  <button type="button" class="btn ghost" data-act="mute" id="btnMute">Mute</button>
  <button type="button" class="btn ghost" data-act="full">Full</button>
  <button type="button" class="btn" data-act="menu">Menu</button>
  <a class="paypal-mini" href="https://www.paypal.com/paypalme/ExcavationPro" target="_blank" rel="noopener">PayPal</a>
</header>

<div id="battle" class="battle hidden">
  <main class="stage">
    <aside class="team left" id="teamYou"></aside>
    <div class="viewport">
      <canvas id="arena" aria-label="LYGO Arena battle"></canvas>
      <div class="announce" id="announce"></div>
      <div class="meters">
        <i class="mo" id="meterYou"></i>
        <span id="arenaClock">0:00</span>
        <i class="mf" id="meterFoe"></i>
      </div>
      <div class="feed" id="feed" aria-live="polite"></div>
    </div>
    <aside class="team right" id="teamFoe"></aside>
  </main>
</div>

<footer class="dock">
  <span class="dock-note" id="dockStatus">Pick a team · the AI does the rest</span>
  <span class="grow"></span>
  <a class="games-mini" href="./whitepaper.html">Whitepaper</a>

  <a class="paypal-mini" href="https://www.paypal.com/paypalme/ExcavationPro" target="_blank" rel="noopener">Donate</a>
</footer>

<div id="overlay" class="overlay"></div>

<script src="/games/arcade-ledger.js?v=5"></script>
<script src="./roster.js?v=1"></script>
<script src="./arena.js?v=1"></script>
<script src="./arena-ui.js?v=1"></script>
