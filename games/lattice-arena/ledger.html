<body>
<div class="wrap">
  <p class="kicker">Δ9Φ963 · live hall</p>
  <h1>LYGO Arena ledger</h1>
  <p class="muted">Arena finishes, posted from the ring. A callsign is optional; nothing but the call, the mode, the side that won and the MVP is ever sent. Empty beats a fake board.</p>
  <div class="row">
    <a class="btn" href="./">Play</a>

    <a class="btn" href="/games/">Hub</a>

    <a class="btn" href="https://www.paypal.com/paypalme/ExcavationPro" rel="noopener">PayPal</a>
  </div>
  <p class="muted" id="srcMeta">Loading…</p>
  <h2>This browser</h2>
  <div id="mine"></div>
  <h2>Hall</h2>
  <div id="hall"></div>
</div>
<script>
(function(){
  function esc(s){ return String(s||"").replace(/[<>]/g,""); }
  var FEEDS = [
    "https://huggingface.co/datasets/DeepSeekOracle/lattice-marines-wins/resolve/main/arcade.json",
    "https://deepseekoracle-lattice-marines-ledger.hf.space/arcade.json",
    "./arcade.json"
  ];
  /* the shared book holds every game's rows; this page only shows the arena's own. */
  function arenaOnly(list){
    return (list || []).filter(function(r){ return !r.game || r.game === "lattice-arena"; });
  }
  async function pull(){
    var rows = [], src = "this browser";
    for (var i=0;i<FEEDS.length;i++){
      try {
        var r = await fetch(FEEDS[i], { cache:"no-store" });
        if (!r.ok) continue;
        var data = await r.json();
        var list = data.rounds || data.runs || (data.books && data.books["lattice-arena"] && (data.books["lattice-arena"].rows || data.books["lattice-arena"].runs)) || (Array.isArray(data) ? data : []);
        list = arenaOnly(list);
        if (list && list.length) { rows = list.slice(); src = FEEDS[i].replace(/^https?:\/\//,""); break; }
      } catch(e) {}
    }
    var queued = [];
    try {
      var q = JSON.parse(localStorage.getItem("lygo-lattice-arena-ledger-q") || "[]");
      var s = JSON.parse(localStorage.getItem("lygo_lattice_arena_v1") || "{}");
      queued = q.slice();
      if (s.name && (s.wins || s.losses)) queued.push({ name: s.name, score: s.wins, mode: "session", outcome: (s.wins >= s.losses ? "win" : "loss"), date: "local" });
    } catch(e) {}
    document.getElementById("srcMeta").textContent = rows.length ? ("Showing " + rows.length + " · " + src) : "Hall is empty — a real zero.";
    document.getElementById("mine").innerHTML = queued.slice(-12).reverse().map(card).join("") || "<p class='muted'>No finishes recorded in this browser yet.</p>";
    var sorted = rows.slice().sort(function(a,b){ return (b.score||0)-(a.score||0); });
    document.getElementById("hall").innerHTML = sorted.slice(0,40).map(card).join("") || "<p class='muted'>No arena finishes posted yet — the first callsign goes here.</p>";
  }
  function card(r){
    return "<div class='round'><div class='rtop'><b>"+esc(r.name||"Spectator")+"</b><span>"+esc(r.score||0)+" W</span></div>"+
      "<div class='rmeta'>"+(r.mode?("<b>"+esc(r.mode)+"</b> · "):"")+(r.mvp?("MVP <b>"+esc(r.mvp)+"</b> · "):"")+esc(r.outcome||r.event||"match")+" · "+esc(r.date||"")+"</div></div>";
  }
  pull();
  setInterval(pull, 40000);
})();
</script>
